name: build-python-fastapi

on:
  workflow_dispatch:
    inputs:
      versions:
        description: "Python 版本（空格分隔，留空=全部矩阵版本）"
        required: false
        default: ""
  push:
    tags: ["py-v*"]

permissions:
  contents: read
  packages: write

jobs:
  config:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.set.outputs.versions }}
      image: ${{ steps.set.outputs.image }}
    steps:
      - id: set
        run: |
          ALL='["3.15"]'
          INPUT="${{ github.event.inputs.versions }}"
          if [ "${{ github.event_name }}" = "push" ] || [ -z "$INPUT" ]; then
            echo "versions=$ALL" >> "$GITHUB_OUTPUT"
          else
            V=$(printf '%s\n' "$INPUT" | tr ' ' '\n' | sed '/^$/d; s/.*/"&"/' | paste -sd, -)
            echo "versions=[$V]" >> "$GITHUB_OUTPUT"
          fi
          OWNER_LC=$(printf '%s' "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/${OWNER_LC}/python-fastapi" >> "$GITHUB_OUTPUT"

  build:
    needs: config
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJson(needs.config.outputs.versions) }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        run: |
          # ${version} 精确 tag + latest 联动（矩阵只含最新版时 latest 始终正确）
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --provenance=false --sbom=false \
            --file python-fastapi/Dockerfile-${{ matrix.version }} \
            --tag ${{ needs.config.outputs.image }}:${{ matrix.version }} \
            --tag ${{ needs.config.outputs.image }}:latest \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            --push python-fastapi
